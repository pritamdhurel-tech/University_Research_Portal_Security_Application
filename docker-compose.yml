services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: research_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8003:8003"
    environment:
      NODE_ENV: production
      PORT: 8003
      DATABASE_URL: postgres://postgres:${DB_PASSWORD}@db:5432/research_portal
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: http://${VM_IP}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
     - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
