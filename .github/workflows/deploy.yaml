name: Deploy University Research Portal Application to the AWS Instances

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend tests
        working-directory: backend
        env:
          JWT_ACCESS_SECRET: ci-dummy
          JWT_REFRESH_SECRET: ci-dummy
          DATABASE_URL: postgresql://x:x@localhost:5432/x
        run: |
          npm ci
          npx prisma generate
          npm test

  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy on SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ec2-user/University_Research_Portal_Security_Application
            git pull --ff-only origin main
            docker compose up -d --build
