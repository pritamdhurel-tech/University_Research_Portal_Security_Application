name: Deploy University Research Portal Application to the AWS Instances

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

  steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: Deploy on SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ec2-username
        key: ${{ secrets.SSH_KEY }}

        script_stop: true

        script: |
          cd /root/University_Research_Portal_Security_Application
          git pull --ff-only origin main
          docker compose up -d --build
